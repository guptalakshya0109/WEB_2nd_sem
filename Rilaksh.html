<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rilaksh ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg,#d2a561,#ff9a9e,#fad0c4);
    color:white;
    text-align:center;
    overflow-x:hidden;
}

.card {
    margin:20px;
    padding:20px;
    border-radius:20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

button {
    padding:10px 20px;
    border:none;
    border-radius:25px;
    background:white;
    color:#ff4d6d;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.heart {
    position:fixed;
    bottom:-10px;
    animation: float 6s linear infinite;
}
@keyframes float {
    to {transform: translateY(-100vh); opacity:0;}
}

#typing {
    border-right:2px solid white;
    white-space:nowrap;
    overflow:hidden;
}

.chat { text-align:left; }

.msg {
    background:white;
    color:black;
    padding:10px;
    border-radius:10px;
    margin:5px;
    width:fit-content;
    cursor:pointer;
    transition:0.3s;
}
.msg:hover {
    background:#ff4d6d;
    color:white;
}

.slide {
    display:none;
    width:200px;
    border-radius:15px;
}

input {
    padding:10px;
    border-radius:10px;
    border:none;
}
</style>
</head>

<body>

<!-- ✅ AUDIO FIXED -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<h1>Happy Birthday Rilaksh ❤️</h1>

<!-- PASSWORD -->
<div class="card">
<h3>Enter Secret Code 🔐</h3>
<input id="pass">
<button onclick="checkPass()">Unlock</button>
</div>

<!-- MAIN CONTENT -->
<div id="main" style="display:none;">

<div class="card">
<h2>💌 My Love</h2>
<p id="typing"></p>
</div>

<div class="card chat">
<h3>Our Story 💬</h3>
<div id="chatBox"></div>
</div>

<div class="card">
<h3>Memories 📸</h3>
<img class="slide" src="photo1.jpeg">
<img class="slide" src="photo2.jpeg">
<img class="slide" src="photo3.jpeg">
<img class="slide" src="photo4.jpeg">
<img class="slide" src="photo5.jpeg">
</div>

<div class="card">
<h3>Love Quiz 🎮</h3>

<div id="quizBox">
    <p id="question"></p>
    <div id="options"></div>
    <button onclick="nextQuestion()">Next ➡️</button>
</div>

</div>
</div>

<script>

/* ✅ PASSWORD + MUSIC START */
function checkPass(){
    if(document.getElementById("pass").value==="Rilaksh@0129"){
        document.getElementById("main").style.display="block";

        // PLAY MUSIC AFTER USER ACTION
        let music = document.getElementById("bgMusic");
        music.play().catch(() => {
            alert("Click anywhere to start music 🎵");
        });

    } else {
        alert("Wrong password 😝");
    }
}

/* Typing */
let text="Rilaksh, you are my forever ❤️ I love you endlessly.";
let i=0;
function type(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text[i];
        i++;
        setTimeout(type,40);
    }
}
type();

/* Chat */
let msgs=["Hi ❤️","I miss you","You are my world 🌍","Forever yours 💖"];
let j=0;
function showChat(){
    if(j<msgs.length){
        let div=document.createElement("div");
        div.className="msg";
        div.innerText=msgs[j];
        document.getElementById("chatBox").appendChild(div);
        j++;
        setTimeout(showChat,1000);
    }
}
showChat();

/* Slideshow */
let slideIndex=0;
function showSlides(){
    let slides=document.getElementsByClassName("slide");
    for(let i=0;i<slides.length;i++) slides[i].style.display="none";
    slideIndex++;
    if(slideIndex>slides.length) slideIndex=1;
    slides[slideIndex-1].style.display="block";
    setTimeout(showSlides,2000);
}
showSlides();

/* Quiz */
const quizData = [
{q:"How much do you love me? ❤️",options:["10%","40%","70%","Infinite 💖"],answer:3},
{q:"Are you always with me? 🥺",options:["Yes ❤️","No","None"],answer:0},
{q:"Favorite person? 😍",options:["Me 😎","Me again 😎","Only me ❤️","All 💖"],answer:3},
];

let currentQ=0, score=0, answered=false;

function loadQuestion(){
    answered=false;
    let q=quizData[currentQ];
    document.getElementById("question").innerText=q.q;

    let html="";
    q.options.forEach((opt,i)=>{
        html+=`<div onclick="selectOption(${i},this)" class="msg">${opt}</div>`;
    });
    document.getElementById("options").innerHTML=html;
}

function selectOption(i,el){
    if(answered) return;
    answered=true;

    if(i===quizData[currentQ].answer){
        score++;
        el.style.background="green";
    } else {
        el.style.background="red";
    }
}

function nextQuestion(){
    if(!answered){
        alert("Select answer 😊");
        return;
    }

    currentQ++;
    if(currentQ<quizData.length){
        loadQuestion();
    } else {
        document.getElementById("quizBox").innerHTML=`<h2>Score ${score}</h2>`;
    }
}
loadQuestion();

/* Hearts */
setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="💖";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
},300);

/* Fireworks */
document.addEventListener("click",(e)=>{
    for(let i=0;i<10;i++){
        let s=document.createElement("div");
        s.style.position="fixed";
        s.style.left=e.clientX+"px";
        s.style.top=e.clientY+"px";
        s.style.width="5px";
        s.style.height="5px";
        s.style.background="white";
        s.style.transition="1s";
        document.body.appendChild(s);
        setTimeout(()=>{
            s.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*200-100}px)`;
            s.style.opacity=0;
        },10);
        setTimeout(()=>s.remove(),1000);
    }
});
</script>

</body>
</html>
