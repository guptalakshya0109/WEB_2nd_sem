```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love 💖</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: black;
    color: white;
    overflow: hidden;
    text-align: center;
}

/* INTRO SCREEN */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    color: red;
    z-index: 10;
    cursor: pointer;
}

/* MAIN CONTENT */
#main {
    display: none;
    padding-top: 30px;
}

/* GLOW TEXT */
.glow {
    font-size: 40px;
    color: #ff4b5c;
    text-shadow: 0 0 20px #ff4b5c;
}

/* TYPEWRITER */
#type {
    width: 80%;
    margin: auto;
    font-size: 18px;
    border-right: 2px solid white;
    white-space: nowrap;
    overflow: hidden;
}

/* BUTTON */
.btn {
    padding: 10px 20px;
    border-radius: 20px;
    background: #ff4b5c;
    border: none;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

/* GALLERY SLIDESHOW */
.gallery {
    width: 300px;
    height: 200px;
    margin: 20px auto;
    overflow: hidden;
}
.gallery img {
    width: 100%;
    display: none;
    border-radius: 10px;
}

/* HEART CLICK */
.heart {
    position: fixed;
    color: pink;
    animation: float 2s linear;
}
@keyframes float {
    to { transform: translateY(-100px); opacity: 0; }
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro" onclick="startSite()">
    ❤️ Tap to Open Your Surprise ❤️
</div>

<!-- MAIN -->
<div id="main">

<h1 class="glow">Happy Birthday HER_NAME 💖</h1>

<!-- TYPEWRITER MESSAGE -->
<div id="type"></div>

<!-- MUSIC CONTROL -->
<button class="btn" onclick="toggleMusic()">🎵 Play / Pause Music</button>

<!-- GALLERY -->
<div class="gallery">
    <img src="photo1.jpg" class="slide">
    <img src="photo2.jpg" class="slide">
    <img src="photo3.jpg" class="slide">
</div>

<!-- VIDEO -->
<video width="80%" controls>
    <source src="video.mp4" type="video/mp4">
</video>

</div>

<!-- MUSIC -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

// START SITE
function startSite(){
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
    document.getElementById("music").play();
    typeWriter();
}

// TYPEWRITER EFFECT
let text = "On your special day, I just want to tell you how much you mean to me. You are my happiness, my peace, and my favorite person in this world 💕 Every moment with you is like a beautiful dream come true ✨ I’m so lucky to have you in my life 💖";
let i = 0;
function typeWriter(){
    if(i < text.length){
        document.getElementById("type").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
    }
}

// MUSIC CONTROL
function toggleMusic(){
    let music = document.getElementById("music");
    if(music.paused) music.play();
    else music.pause();
}

// SLIDESHOW
let slides = document.getElementsByClassName("slide");
let index = 0;
setInterval(()=>{
    for(let i=0;i<slides.length;i++){
        slides[i].style.display="none";
    }
    slides[index].style.display="block";
    index = (index+1)%slides.length;
},2000);

// HEART CLICK EFFECT
document.addEventListener("click", function(e){
    let heart = document.createElement("div");
    heart.innerHTML="💖";
    heart.className="heart";
    heart.style.left=e.clientX+"px";
    heart.style.top=e.clientY+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),2000);
});

</script>

</body>
</html>
